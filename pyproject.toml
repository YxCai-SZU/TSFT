[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tsft"
version = "0.1.0"
description = "Extensible SFT/QLoRA framework for ACSL specification generation"
requires-python = ">=3.10,<3.13"

[project.scripts]
tsft-train = "tsft.train:main"

[tool.setuptools.packages.find]
where = ["src"]
